[project]
name = "crowd-server"
version = "0.0.0"
description = "crowD server"
requires-python = ">=3.10"
dependencies = ["crowd-core", "crowd-sim", "crowd-connectors", "fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crowd_server"]

[tool.uv.sources]
crowd-core = { workspace = true }
crowd-sim = { workspace = true }
crowd-connectors = { workspace = true }
