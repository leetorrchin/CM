[project]
name = "crowd-server"
version = "0.0.0"
description = "crowD server"
requires-python = ">=3.10"
dependencies = ["crowd-core", "crowd-connectors", "fastapi>=0.110", "uvicorn>=0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crowd_server"]

[tool.uv.sources]
crowd-core = { workspace = true }
crowd-connectors = { workspace = true }
