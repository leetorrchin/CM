[project]
name = "crowd-sim"
version = "0.0.0"
description = "crowD sim"
requires-python = ">=3.10"
dependencies = ["crowd-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crowd_sim"]

[tool.uv.sources]
crowd-core = { workspace = true }
